watch_stylesheet: true
watch_config: true
debug: false
update_check: true
show_systray: true
system_colors: false

tooltip:
  offset: 6
  blur_effect:
    enabled: true
    dark_mode: true
    round_corners: true
    round_corners_type: small
    border_color: "#303b40"

glazewm:
  start_command: "glazewm.exe start"
  stop_command: "glazewm.exe command wm-exit"
  reload_command: "glazewm.exe command wm-reload-config"

bars:
  work-bar:
    enabled: true
    screens: ['*']
    class_name: "yasb-bar"
    style: "bar"
    context_menu: true
    alignment:
      position: "bottom"
      align: "center"
    animation:
      enabled: true
      duration: 180
      type: "fade"
    blur_effect:
      enabled: false
      dark_mode: true
      round_corners: false
      border_color: "None"
    window_flags:
      always_on_top: true
      windows_app_bar: true
      hide_on_fullscreen: true
      auto_hide: false
    dimensions:
      width: "100%"
      height: 40
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    layouts:
      left:
        alignment: "left"
        stretch: true
      center:
        alignment: "center"
        stretch: true
      right:
        alignment: "right"
        stretch: true
    widgets:
      left:
        - "home"
        - "glazewm_workspaces"
        - "glazewm_tiling_direction"
      center:
        - "taskbar"
      right:
        - "codex_usage"
        - "dnd"
        - "cpu"
        - "memory"
        - "gpu"
        - "microphone"
        - "volume"
        - "systray"
        - "clock"

widgets:
  home:
    type: "yasb.home.HomeWidget"
    options:
      label: "⊞"
      menu_list: []
      system_menu: true
      power_menu: true
      blur: true
      round_corners: true
      round_corners_type: small
      border_color: "#303b40"
      alignment: left
      direction: up
      offset_top: 6
      offset_left: 0

  taskbar:
    type: "yasb.taskbar.TaskbarWidget"
    options:
      icon_size: 20
      tooltip: true
      show_only_visible: false
      strict_filtering: true
      monitor_exclusive: true
      hide_empty: false
      animation:
        enabled: true
        duration: 180
      preview:
        enabled: true
        width: 260
        delay: 350
        padding: 8
        margin: 8
        blur: true
        peek: false
      grouping:
        enabled: true
        show_count: true
      title_label:
        enabled: false
        show: "focused"
        min_length: 10
        max_length: 30
      ignore_apps:
        processes: []
        titles: []
        classes: []

  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "WM OFFLINE"
      populated_label: "{name} {display_name}"
      empty_label: "{name} {display_name}"
      active_populated_label: "{name} {display_name}"
      active_empty_label: "{name} {display_name}"
      focused_populated_label: "{name} {display_name}"
      focused_empty_label: "{name} {display_name}"
      hide_if_offline: false
      monitor_exclusive: false
      enable_scroll_switching: true
      reverse_scroll_direction: false
      app_icons:
        enabled_populated: false
        enabled_active: false
        enabled_focused: false
        size: 14
        max_icons: 0
        hide_label: false
        hide_duplicates: true
        hide_floating: true

  glazewm_tiling_direction:
    type: "glazewm.tiling_direction.GlazewmTilingDirectionWidget"
    options:
      horizontal_label: "↔"
      vertical_label: "↕"

  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[app_name]}  ·  {win[title]}"
      label_alt: "{win[process][name]}"
      label_no_window: "DESKTOP"
      label_icon: true
      label_icon_size: 16
      max_length: 72
      max_length_ellipsis: "…"
      monitor_exclusive: true
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "do_nothing"

  codex_usage:
    type: "yasb.codex_usage.CodexUsageWidget"
    options:
      label: "CODEX {primary_remaining}%"
      label_alt: "CODEX {secondary_window} {secondary_remaining}%"
      codex_path: "__CODEX_CLI__"
      update_interval: 60
      cache_ttl: 120
      timeout: 15
      show_token_usage: true
      stale_icon: "!"
      progress_bar:
        enabled: true
        progress_type: "linear_horizontal"
        size: 28
        thickness: 4
        radius: 2
        color: "#8eafaa"
        background_color: "#2b363b"
        position: "left"
        animation: true
      callbacks:
        on_left: "toggle_menu"
        on_middle: "refresh"
        on_right: "toggle_label"
      menu:
        blur: true
        round_corners: true
        round_corners_type: small
        border_color: "#303b40"
        alignment: right
        direction: up
        offset_top: 6
        offset_left: 0
        show_overview: true
        show_models: true
        show_activity: true
        show_resets: true
        show_details: true

  dnd:
    type: "yasb.dnd.DndWidget"
    options:
      label: "FOCUS {icon}"
      label_alt: "FOCUS {status}"
      tooltip: true
      default_active_mode: "priority"
      callbacks:
        on_left: "toggle_status"
        on_middle: "toggle_label"
        on_right: "cycle_status"
      icons:
        disabled: "○"
        priority: "●"
        alarms: "!"

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "CPU {info[percent][total]}%"
      label_alt: "CPU {info[freq][current]} MHz"
      update_interval: 2500
      hide_decimal: true
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_menu"
      menu:
        enabled: true
        blur: true
        round_corners: true
        round_corners_type: small
        border_color: "#303b40"
        alignment: right
        direction: up
        offset_top: 6
        offset_left: 0
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "RAM {virtual_mem_percent}%"
      label_alt: "RAM {virtual_mem_used}/{virtual_mem_total}"
      update_interval: 5000
      hide_decimal: true
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_menu"
      menu:
        enabled: true
        blur: true
        round_corners: true
        round_corners_type: small
        border_color: "#303b40"
        alignment: right
        direction: up
        offset_top: 6
        offset_left: 0
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60

  gpu:
    type: "yasb.gpu.GpuWidget"
    options:
      label: "GPU {info[utilization]}%"
      label_alt: "GPU {info[temp]}°C"
      gpu_index: 0
      update_interval: 2500
      hide_decimal: true
      units: "metric"
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_menu"
      menu:
        enabled: true
        blur: true
        round_corners: true
        round_corners_type: small
        border_color: "#303b40"
        alignment: right
        direction: up
        offset_top: 6
        offset_left: 0
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60

  microphone:
    type: "yasb.microphone.MicrophoneWidget"
    options:
      label: "MIC {level}"
      label_alt: "MIC {level}"
      mute_text: "OFF"
      tooltip: true
      scroll_step: 2
      callbacks:
        on_left: "toggle_mic_menu"
        on_middle: "toggle_label"
        on_right: "toggle_mute"
      mic_menu:
        blur: true
        round_corners: true
        round_corners_type: small
        border_color: "#303b40"
        alignment: right
        direction: up
        offset_top: 6
        offset_left: 0

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "VOL {level}"
      label_alt: "VOL {level}"
      mute_text: "OFF"
      tooltip: true
      scroll_step: 2
      slider_beep: false
      callbacks:
        on_left: "toggle_volume_menu"
        on_middle: "do_nothing"
        on_right: "toggle_mute"
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: small
        border_color: "#303b40"
        alignment: right
        direction: up
        offset_top: 6
        offset_left: 0
        show_apps: true
        show_apps_expanded: false

  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "▴"
      label_expanded: "▾"
      label_position: "left"
      icon_size: 16
      pin_click_modifier: "alt"
      show_unpinned: false
      show_unpinned_button: true
      show_in_popup: true
      icons_per_row: 5
      popup:
        blur: true
        round_corners: true
        round_corners_type: small
        border_color: "#303b40"
        alignment: right
        direction: up
        offset_top: 6
        offset_left: 0
      show_battery: false
      show_volume: false
      show_network: false
      tooltip: true
      use_hook: false
      hide_icons: []

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%H:%M}  ·  {%d %b}"
      label_alt: "{%A, %d %B %Y}"
      tooltip: true
      update_interval: 30000
      timezones: []
      calendar:
        blur: true
        round_corners: true
        round_corners_type: small
        border_color: "#303b40"
        alignment: right
        direction: up
        offset_top: 6
        offset_left: 0
        show_holidays: false
        show_week_numbers: true
        show_years: true
        extended: false
      callbacks:
        on_left: "toggle_calendar"
        on_middle: "next_timezone"
        on_right: "toggle_label"
